[nightlight]
temperature_day = 6700
temperature_night = 4600

[shell]
avatar_path = "/home/oliver/Pictures/Avatars/skeletongrass.jpg"
button_borders = false
card_borders = false
font_family = "JetBrains Mono SemiBold"
input_borders = false
password_style = "random"
popup_borders = false
popup_shadows = false
screen_time_enabled = true
telemetry_enabled = true

    [shell.animation]
    speed = 2.0000000298023224

    [shell.launcher]
    categories = false
    compact = true

        [shell.launcher.providers.emoji]
        global = false

    [shell.panel]
    shadow = false
    transparency_mode = "soft"

    [shell.screen_corners]
    size = 15

    [shell.screenshot]
    directory = "/home/oliver/Pictures/Screenshots"

[theme]
builtin = "Kanagawa"
community_palette = "Creamy Forest"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "emacs", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "starship" ]
    community_ids = [ "feishin", "discord", "vscode", "steam" ]

[wallpaper]
directory = "/home/oliver/Pictures/Wallpapers"
fill_color = "primary"
transition = [ "disc", "fade", "honeycomb", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/oliver/Pictures/Wallpapers/02_dark_wallpapers/green_forest-1.jpg"

    [wallpaper.last]
    path = "/home/oliver/Pictures/Wallpapers/02_dark_wallpapers/green_forest-1.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/oliver/Pictures/Wallpapers/02_dark_wallpapers/green_forest-1.jpg"

[weather]
unit = "imperial"